<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${todoId != null} ? 'Edit Todo' : 'New Todo'">Todo Form - Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/todos}" class="btn btn-link p-0 me-3 text-decoration-none text-muted">← Back</a>
                <h4 class="mb-0 fw-bold"
                    th:text="${todoId != null} ? 'Edit Todo' : 'New Todo'">New Todo</h4>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <!-- Create form -->
                    <form th:if="${todoId == null}" th:action="@{/todos}" method="post"
                          th:object="${todoRequest}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" th:field="*{title}"
                                   required autofocus placeholder="What needs to be done?">
                        </div>
                        <div class="mb-4">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}"
                                      rows="3" placeholder="Optional details..."></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Create</button>
                            <a th:href="@{/todos}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>

                    <!-- Edit form -->
                    <form th:if="${todoId != null}" th:action="@{/todos/{id}(id=${todoId})}" method="post"
                          th:object="${todoRequest}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="editTitle" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editTitle" th:field="*{title}"
                                   required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="editDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="editDescription" th:field="*{description}"
                                      rows="3"></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                            <a th:href="@{/todos}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
