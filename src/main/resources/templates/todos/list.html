<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todos - Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-0 fw-bold">My Todos</h4>
            <small class="text-muted" th:text="${todos.size()} + ' item(s)'"></small>
        </div>
        <a th:href="@{/todos/new}" class="btn btn-primary">+ New Todo</a>
    </div>

    <!-- Empty state -->
    <div th:if="${todos.isEmpty()}" class="text-center py-5 text-muted">
        <p class="mb-2">No todos yet.</p>
        <a th:href="@{/todos/new}" class="btn btn-outline-primary btn-sm">Create your first todo</a>
    </div>

    <!-- Todo list -->
    <div th:unless="${todos.isEmpty()}" class="list-group">
        <div th:each="todo : ${todos}"
             class="list-group-item list-group-item-action px-3 py-3"
             th:classappend="${todo.completed} ? 'todo-completed' : ''">
            <div class="d-flex align-items-start gap-3">

                <!-- Toggle checkbox -->
                <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post" class="mt-1">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="checkbox" class="form-check-input"
                           th:checked="${todo.completed}"
                           onchange="this.form.submit()"
                           title="Toggle completion">
                </form>

                <!-- Content -->
                <div class="flex-grow-1">
                    <div class="fw-semibold" th:text="${todo.title}"
                         th:classappend="${todo.completed} ? 'text-decoration-line-through text-muted' : ''"></div>
                    <div th:if="${todo.description != null and !todo.description.isEmpty()}"
                         class="text-muted small mt-1" th:text="${todo.description}"></div>
                    <div class="text-muted" style="font-size: 0.75rem; margin-top: 4px;">
                        <span th:text="${#temporals.format(todo.createdAt, 'MMM d, yyyy')}"></span>
                    </div>
                </div>

                <!-- Status badge -->
                <span th:if="${todo.completed}" class="badge bg-success align-self-center">Done</span>
                <span th:unless="${todo.completed}" class="badge bg-secondary align-self-center">Pending</span>

                <!-- Actions -->
                <div class="d-flex gap-2 align-self-center">
                    <a th:href="@{/todos/{id}(id=${todo.id})}"
                       class="btn btn-outline-primary btn-sm">View</a>
                    <a th:href="@{/todos/{id}/edit(id=${todo.id})}"
                       class="btn btn-outline-secondary btn-sm">Edit</a>
                    <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post"
                          onsubmit="return confirm('Delete this todo?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
